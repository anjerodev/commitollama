name: Release Extension

on:
  pull_request:
    types: [closed]
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.merged == true &&
       contains(github.event.pull_request.labels.*.name, 'Release'))
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Fetch full history for version tagging
          
      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'
          
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        
      - name: Run linting
        run: pnpm run lint
        
      - name: Build extension
        run: pnpm run build
        
      - name: Run tests
        run: xvfb-run -a pnpm test
        
      - name: Get version from package.json
        id: get-version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Extension version: $VERSION"
          
      - name: Package extension
        run: pnpm run package

      - name: Prepare release notes
        id: release-notes
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          {
            echo "## Release v${VERSION}"
            echo
            if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
              echo "Manually triggered release from main."
            else
              echo "This release was automatically created from PR #${{ github.event.pull_request.number }}: ${{ github.event.pull_request.title }}"
              echo
              echo "### Changes"
              echo "$PR_BODY"
            fi
          } > release-notes.md
          
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        id: create-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: v${{ steps.get-version.outputs.version }}
          name: Release v${{ steps.get-version.outputs.version }}
          body_path: release-notes.md
          files: |
            commitollama-${{ steps.get-version.outputs.version }}.vsix
          draft: false
          prerelease: false
          
      - name: Publish to VS Code Marketplace
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: pnpm exec vsce publish --pat $VSCE_PAT
